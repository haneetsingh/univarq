<!doctype html>
<!--
  Netlify's form-detection bot parses static HTML at deploy time.
  Next.js renders this form client-side, so it isn't guaranteed to be
  crawled from the live page. This file exists purely so Netlify
  registers the "contact" form and its fields; it is never served to
  users and is not linked from anywhere.
-->
<html>
  <body>
    <form name="contact" data-netlify="true" netlify-honeypot="company" hidden>
      <input type="text" name="name" />
      <input type="email" name="email" />
      <textarea name="message"></textarea>
      <input type="text" name="company" />
    </form>
  </body>
</html>
